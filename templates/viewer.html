<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>InsightLens Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #111;
            --text-color: #f0f0f0;
            --primary-color: #3b82f6;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --icon-color: #999;
            --icon-hover-color: #fff;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            cursor: grab;
        }
        #video-container.panning { cursor: grabbing; }
        #video-stream {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }
        #connection-status {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }
        .status-card {
            background-color: var(--card-bg);
            padding: 3rem 4rem;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .logo { font-size: 2rem; font-weight: 600; }
        .logo .icon { margin-right: 0.5rem; }
        #qr-code-container img {
            border-radius: 0.5rem;
            border: 4px solid var(--border-color);
        }
        #camera-url {
            background-color: #2a2a2a;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-family: monospace;
            word-break: break-all;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }
        .status-text {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--icon-color);
        }
        .spinner {
            width: 1em;
            height: 1em;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="connection-status">
        <div class="status-card">
            <div class="logo"><span class="icon">🔍</span>InsightLens</div>
            <p>Scan the QR code with your phone's camera.</p>
            <div id="qr-code-container">
                <img src="/static/qrcode.png" alt="QR Code to connect camera">
            </div>
            <div id="camera-url" title="Click to copy">{{ camera_url }}</div>
            <div class="status-text">
                <div class="spinner"></div>
                <span>Waiting for camera...</span>
            </div>
        </div>
    </div>

    <div id="video-container">
        <img id="video-stream" alt="Live stream from camera">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const socket = io({
                transports: ['websocket'],
                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 1000,
            });

            const videoContainer = document.getElementById('video-container');
            const videoStream = document.getElementById('video-stream');
            const connectionStatus = document.getElementById('connection-status');
            const urlDisplay = document.getElementById('camera-url');

            let isFrozen = false;
            let transform = {
                scale: 1,
                translateX: 0,
                translateY: 0
            };

            function updateTransform() {
                if (!isFrozen) {
                     videoStream.style.transform = `translate(${transform.translateX}px, ${transform.translateY}px) scale(${transform.scale})`;
                }
            }

            socket.on('connect', () => {
                console.log('Connected to server as viewer.');
                socket.emit('viewer_joined');
            });

            socket.on('camera_connected', (data) => {
                console.log('Camera connected:', data.camera_id);
                connectionStatus.style.display = 'none';
                videoContainer.style.display = 'block';
            });

            socket.on('camera_already_connected', (data) => {
                 console.log('Reconnecting to existing camera:', data.camera_id);
                 connectionStatus.style.display = 'none';
                 videoContainer.style.display = 'block';
            });

            socket.on('camera_disconnected', (data) => {
                console.log('Camera disconnected:', data.camera_id);
                videoContainer.style.display = 'none';
                connectionStatus.style.display = 'flex';
                // Reset view on disconnect
                transform = { scale: 1, translateX: 0, translateY: 0 };
                updateTransform();
            });

            socket.on('new_frame', (data) => {
                if (!isFrozen) {
                    videoStream.src = `data:image/jpeg;base64,${data.frame}`;
                }
            });

            urlDisplay.addEventListener('click', () => {
                navigator.clipboard.writeText(urlDisplay.textContent).then(() => {
                    console.log('URL copied to clipboard');
                    alert('URL copied to clipboard!');
                }).catch(err => {
                    console.error('Failed to copy URL: ', err);
                });
            });

        });
    </script>
</body>
</html>
