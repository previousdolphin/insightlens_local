<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>InsightLens Camera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000;
            --text-color: #f0f0f0;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
        }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }
        #camera-view {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            text-align: center;
        }
        .camera-icon { font-size: 3rem; }
        #start-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-size: 1.25rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #start-button:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="camera-icon">📷</div>
        <h2>Camera Ready</h2>
        <p>Tap below to begin streaming to your viewer.</p>
        <button id="start-button">Start Camera</button>
    </div>

    <video id="camera-view" playsinline autoplay muted></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const socket = io({ transports: ['websocket'] });

            const startScreen = document.getElementById('start-screen');
            const startButton = document.getElementById('start-button');
            const video = document.getElementById('camera-view');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');

            let streamInterval;
            const FRAME_RATE = 15;

            async function startCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        }
                    });
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        startScreen.style.display = 'none';
                        video.style.display = 'block';

                        socket.emit('camera_joined');

                        // Start sending frames
                        if (streamInterval) clearInterval(streamInterval);
                        streamInterval = setInterval(() => {
                            if (socket.connected) {
                                sendFrame();
                            }
                        }, 1000 / FRAME_RATE);
                    };
                } catch (err) {
                    console.error("Error accessing camera: ", err);
                    alert("Could not access the camera. Please ensure you've given permission and are using HTTPS.");
                    startScreen.style.display = 'flex';
                }
            }

            function sendFrame() {
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                // Quality can be adjusted from 0.0 to 1.0
                const frameData = canvas.toDataURL('image/jpeg', 0.7);
                socket.emit('video_frame', { frame: frameData.split(',')[1] });
            }

            startButton.addEventListener('click', startCamera);

            socket.on('connect', () => console.log('Connected to server as camera.'));
            socket.on('disconnect', () => {
                console.log('Disconnected from server.');
                if (streamInterval) clearInterval(streamInterval);
            });
        });
    </script>
</body>
</html>
lay" class="overlay-container">
        <div class="overlay-panel">
            <h1>📷</h1>
            <h2>Camera Ready</h2>
            <p>Tap below to begin streaming to your viewer.</p>
            <button id="start-camera-btn" class="primary-btn">Start Camera</button>
        </div>
    </div>

    <!-- This wrapper contains the entire camera UI, hidden by default -->
    <div id="camera-ui-wrapper" class="hidden">
        <div id="camera-status">
            <div class="status-indicator">
                <span id="connection-dot" class="dot disconnected"></span>
                <span id="connection-status">Connecting...</span>
            </div>
            <div id="stream-info">
                <span id="resolution-display"></span>
            </div>
        </div>

        <div id="camera-container">
            <video id="camera-view" autoplay playsinline muted></video>
            <div id="camera-overlay">
                <div id="focus-indicator"></div>
            </div>
            <div id="camera-loading" class="loading-overlay hidden">
                <div class="spinner"></div>
                <p>Requesting camera access...</p>
            </div>
            <div id="camera-error" class="error-overlay hidden">
                <div class="error-content">
                    <h3>📷 Camera Access Required</h3>
                    <p id="error-text">Please allow camera access to continue.</p>
                    <button id="retry-camera-btn">Retry</button>
                </div>
            </div>
        </div>

        <div id="camera-controls">
            <div class="control-group" id="zoom-control-group" style="display:none;">
                <label for="zoom-slider">
                    <span class="control-icon">🔍</span>
                    <span id="zoom-display">1.0x</span>
                </label>
                <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1">
            </div>

            <div class="control-group" id="torch-control-group" style="display:none;">
                 <button id="torch-btn" class="control-button toggle-btn">
                    <span class="control-icon">🔦</span>
                    <span id="torch-text">Flash</span>
                </button>
            </div>

            <div class="control-group">
                <label for="framerate-select">
                    <span class="control-icon">⚡</span>
                    <span>FPS</span>
                </label>
                <select id="framerate-select">
                    <option value="10">10</option>
                    <option value="15" selected>15</option>
                    <option value="24">24</option>
                    <option value="30">30</option>
                </select>
            </div>

            <div class="control-group">
                <label for="resolution-select">
                    <span class="control-icon">📐</span>
                    <span>Quality</span>
                </label>
                <select id="resolution-select">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
        </div>
    </div>

    <canvas id="frame-canvas" style="display:none;"></canvas>
    <div id="notification-toast" class="hidden">
        <span id="toast-message"></span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/camera.js', v=cache_buster) }}"></script>
</body>
</html>
